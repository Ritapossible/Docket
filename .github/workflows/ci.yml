name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # A threat-model row may not be marked covered until a test names its ID.
      # This fails the build if spec/THREAT-MODEL.md claims coverage no test backs.
      - name: Threat-model coverage
        run: bash script/check-threat-coverage.sh

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck
        working-directory: sdk
        run: npm install --no-audit --no-fund && npx tsc -p tsconfig.json --noEmit

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: indexer
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: indexer
        run: npx tsc -p tsconfig.json --noEmit

      # Vectors are hand-computed from spec/DCS-1.md, so this checks the implementation
      # against the spec rather than against itself.
      - name: DCS-1 conformance
        working-directory: indexer
        run: node --experimental-strip-types --test test/*.test.ts
