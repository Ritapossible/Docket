name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # A threat-model row may not be marked covered until a test names its ID.
      # This fails the build if spec/THREAT-MODEL.md claims coverage no test backs.
      - name: Threat-model coverage
        run: bash script/check-threat-coverage.sh

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck
        working-directory: sdk
        run: npm install --no-audit --no-fund && npx tsc -p tsconfig.json --noEmit

  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: indexer
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: indexer
        run: npx tsc -p tsconfig.json --noEmit

      # Vectors are hand-computed from spec/DCS-1.md, so this checks the implementation
      # against the spec rather than against itself.
      - name: DCS-1 conformance
        working-directory: indexer
        run: node --experimental-strip-types --test test/*.test.ts

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      # The demo beat is an integration test that happens to be readable: it deploys a real
      # mandate, gets prompt-injected, and fails the build if the refusal does not hold or does
      # not reach the score.
      - name: End-to-end beat
        run: RUNS=2 ./demo/run.sh

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund && npm --prefix console install --no-audit --no-fund

      - name: Typecheck
        run: npm --prefix console run build

      - name: Browser
        run: npx playwright install --with-deps chromium

      # Renders the console against a chain seeded with a real denial and fails if the page
      # loads but shows nothing, or if it overflows horizontally at any supported width -
      # the two failures a typecheck cannot see.
      - name: Render and responsive checks
        run: ./console/scripts/e2e.sh
