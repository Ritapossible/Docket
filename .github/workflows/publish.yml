name: publish dcs-1

# Publishes the showcase mandate's DCS-1 score to the ERC-8004 Reputation Registry.
#
# Separate from the agent workflow, and on a separate key, because the two roles are separate.
# The agent acts; the publisher measures. The registry refuses feedback from the identity's
# owner or operators, so the account that posts a score provably does not control the thing it
# is scoring. Running this as its own job with its own secret keeps that true operationally as
# well as on chain.
#
# Requires one repository secret: PUBLISHER_PRIVATE_KEY (testnet only).
# Settings -> Secrets and variables -> Actions -> New repository secret.

on:
  schedule:
    # Once a day. A DCS-1 score is pinned to a block height, so republishing more often just
    # adds entries that say the same thing - the age term moves in days, not minutes.
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: publish-dcs1
  cancel-in-progress: false

# The manifest is committed back, because the published feedbackURI points at it. A score whose
# manifest never lands is a score nobody can verify cheaply.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The publisher cannot use a manifest to shorten its own work: it has to walk every block
    # to discover which ones to put in the next one. So this job's cost is one request per 100
    # blocks of chain and grows by roughly three minutes per day of mandate age. It was 2.5
    # minutes when the budget was set at 45, and 42 by 10 October - one run away from being
    # cancelled after publishing but before committing the manifest, which would have left a
    # score pointing at a stale file.
    #
    # 90 carries it past judging. The real fix is an incremental manifest: scan the previous
    # manifest's blocks plus only the range added since, which is O(one day) instead of
    # O(all history). Noted in bench/RESULTS.md rather than attempted the day before a freeze.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # A rebase needs history. The default shallow checkout is enough to commit but not
          # reliably enough to rebase onto a moved main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ci, not install. `npm install` rewrites package-lock.json, which left the working tree
      # dirty and made `git pull --rebase` refuse with "You have unstaged changes" - after the
      # score had already been published. See the commit step below.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Publish
        id: publish
        env:
          PUBLISHER_PRIVATE_KEY: ${{ secrets.PUBLISHER_PRIVATE_KEY }}
          MONAD_TESTNET_RPC: https://testnet-rpc.monad.xyz
        run: |
          if [ -z "$PUBLISHER_PRIVATE_KEY" ]; then
            echo "PUBLISHER_PRIVATE_KEY is not set - add it as a repository secret."
            exit 1
          fi
          node --experimental-strip-types script/publish.mjs --execute

      - name: Commit the manifest
        # Before the verification step, not after: the verifier fetches the manifest over HTTP
        # from the default branch, so a manifest still sitting in the runner's working tree is
        # a manifest the verifier cannot see.
        #
        # On 10 October this step failed and took the manifest with it. The score went on chain
        # (424 at block 69761422), the commit was made locally, and then `git pull --rebase`
        # refused because npm install had rewritten package-lock.json. The runner was torn down
        # and the registry entry was left pointing at a three-week-old manifest - the single
        # worst outcome this job has, because the published score looks fine and only the
        # verification path is broken.
        #
        # Three changes so it cannot recur: npm ci above leaves the tree clean, autostash
        # survives it if something else dirties the tree anyway, and the push is attempted
        # before any rebase so the common case never needs one.
        run: |
          set -euo pipefail

          if git diff --quiet -- console/public/dcs1-manifest.json; then
            echo "manifest unchanged"
            exit 0
          fi

          git config user.name  "docket-publisher"
          git config user.email "noreply@anthropic.com"
          git add console/public/dcs1-manifest.json
          git commit \
            -m "Publish DCS-1 manifest" \
            -m "Written by .github/workflows/publish.yml alongside the on-chain score. The feedbackURI of the registry entry points at this file, and a verifier proves it complete against the mandate's nonce before trusting any block in it."

          # Try the straightforward push first. Only reconcile if main actually moved.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected, reconciling with main (attempt ${attempt})"
            git -c rebase.autoStash=true pull --rebase origin main
          done

          echo "could not push the manifest after three attempts"
          exit 1

      - name: Verify the published score recomputes
        # The point of publishing is that anyone can check it. Checking it ourselves, from a
        # cold sync, in the same run that wrote it, is the cheapest version of that promise -
        # and it is what discharges T13 in the threat model.
        #
        # Through the manifest, which is the path a judge will take. The weekly full walk below
        # is what stops the manifest path from quietly becoming the only thing ever checked.
        run: npm run test:published

      - name: Verify again the expensive way, Sundays
        # Deliberately NOT in this job. The daily publish already spends ~42 minutes walking
        # the chain, and the full re-walk costs the same again, so running both inside one
        # 45 minute job meant the cross-check could never finish - the job timeout would
        # cancel it every Sunday, after the publish had already succeeded. A check that is
        # structurally incapable of completing is worse than no check, because the red run
        # looks like a known flake. It lives in verify-full.yml with its own budget.
        if: false
        run: echo "moved to .github/workflows/verify-full.yml"
